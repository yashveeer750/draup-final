<style>
:root { --ink: #0F1115; --grey: #677078; --grey-2: #939BA3; --line: #E4E7ED; --paper: #FFFFFF; --paper-2: #F6F5F3; --coral-d: #C2553C; --sky: #71B3FA;
  --brand: linear-gradient(90deg, #FFE4CD 2%, #EDBDAA 36%, #E9A08C 47.5%, #71B3FA 93%);
  --display: "Sagace", "Google Sans Flex", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", Arial, sans-serif;
  --sans: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "Google Sans Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper-2); color: var(--ink); font-family: var(--sans); position: relative; overflow-x: hidden; }
body::before { content: ""; position: fixed; width: 760px; height: 520px; left: -200px; top: -160px; border-radius: 50%; filter: blur(10px); pointer-events: none;
  background: radial-gradient(closest-side, rgba(243, 176, 146, 0.40), rgba(243, 176, 146, 0) 72%); }
body::after { content: ""; position: fixed; width: 820px; height: 560px; right: -240px; bottom: -200px; border-radius: 50%; filter: blur(10px); pointer-events: none;
  background: radial-gradient(closest-side, rgba(179, 166, 233, 0.34), rgba(169, 185, 238, 0.18) 48%, rgba(169, 185, 238, 0) 76%); }
.card { position: relative; z-index: 1; width: 100%; max-width: 400px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 34px 32px 30px;
  box-shadow: 0 18px 40px rgba(15, 17, 21, 0.08); }
.brand { display: flex; align-items: baseline; gap: 6px; margin-bottom: 26px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 28px; letter-spacing: -0.03em; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--grey); letter-spacing: 0.04em; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 300; font-size: 34px; letter-spacing: -0.035em; line-height: 1.1; margin: 0 0 8px; }
p.lede { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--grey); }
label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--grey); margin: 0 0 16px; }
input { display: block; width: 100%; margin-top: 7px; font: inherit; font-family: var(--sans); font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
input:focus { outline: 2px solid var(--sky); outline-offset: 1px; border-color: transparent; }
button { width: 100%; margin-top: 6px; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--brand); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.msg { min-height: 20px; margin: 14px 0 0; font-size: 14px; color: var(--coral-d); }
.foot { margin: 18px 0 0; font-size: 12.5px; color: var(--grey-2); line-height: 1.5; }
</style>
</head>
<body>

  <h1>Sign in</h1>

    <button id="b" type="submit">Sign in</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <p class="foot">You stay signed in until you close this tab.</p>
</main>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'etter-key-' + P.salt;
  function bytes(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function derive(user, pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function show(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)).then(function (buf) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(KEY, b64(raw)); } catch (e) { /* storage unavailable: sign in again next time */ }
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      });
    });
  }
  var msg = document.getElementById('msg'), btn = document.getElementById('b');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the page. Please use a current browser over https.'; btn.disabled = true; return; }
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) { saved = null; }
  if (saved) crypto.subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, true, ['decrypt']).then(show).catch(function () { try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ } });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; msg.textContent = ''; btn.textContent = 'Signing in\u2026';
    derive(document.getElementById('u').value.trim(), document.getElementById('p').value).then(show).catch(function () {
      btn.disabled = false; btn.textContent = 'Sign in';
      msg.textContent = 'That username and password do not match.';
      document.getElementById('p').select();
    });
  });
})();
</script>
